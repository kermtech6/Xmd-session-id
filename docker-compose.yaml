version: "3.8"

services:
  kerm-session:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./Sessions:/app/Sessions
    environment:
      - NODE_ENV=production
      - PORT=8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
